name: Outfit checks

on: [push, pull_request]

permissions:
  contents: read

jobs:
  outfit-check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npx playwright-core install --with-deps chromium
      - run: npm run test:outfits
